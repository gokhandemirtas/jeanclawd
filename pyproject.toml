[project]
name = "jeanclawd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.14"
dependencies = [
    "aiohttp>=3.13.5",
    "beanie>=2.1.0",
    "ddgs>=9.14.2",
    "deepface>=0.0.99",
    "fastembed>=0.8.0",
    "feedparser>=6.0.12",
    "fuzzy-date>=0.6.0",
    "huesdk>=1.8",
    "json-repair>=0.59.7",
    "lmstudio>=1.5.0",
    "mem0ai[nlp]>=2.0.2",
    "motor>=3.7.1",
    "openai-whisper>=20250625",
    "opencv-python>=4.13.0.92",
    "pocket-tts>=2.1.0",
    "prompt-toolkit>=3.0.52",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.7",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "ruff>=0.15.12",
    "scipy>=1.17.1",
    "sounddevice>=0.5.1",
    "tavily>=1.1.0",
    "tiktoken>=0.12.0",
    "urllib3>=2.7.0",
    "whisper>=1.1.10",
    "yfinance>=1.3.0",
]

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.3.0"]

[tool.ruff]
indent-width = 2

[tool.ruff.format]
indent-style = "tab"
