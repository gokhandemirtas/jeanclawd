[project]
name = "jeanclawd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.14"
dependencies = [
    "aiohttp>=3.13.5",
    "beanie>=2.1.0",
    "deepface>=0.0.99",
    "feedparser>=6.0.12",
    "fuzzy-date>=0.6.0",
    "huesdk>=1.8",
    "lmstudio>=1.5.0",
    "mem0ai>=2.0.2",
    "motor>=3.7.1",
    "opencv-python>=4.13.0.92",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.7",
    "rich>=15.0.0",
    "ruff>=0.15.12",
    "urllib3>=2.7.0",
    "yfinance>=1.3.0",
]

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.3.0"]

[tool.ruff]
indent-width = 2

[tool.ruff.format]
indent-style = "tab"
