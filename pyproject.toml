[project]
name = "jeanclawd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.14"
dependencies = [
    "aiohttp>=3.13.5",
    "beanie>=2.1.0",
    "ddgs>=9.14.2",
    "deepface>=0.0.99",
    "feedparser>=6.0.12",
    "huesdk>=1.8",
    "json-repair>=0.59.7",
    "lmstudio>=1.5.0",
    "motor>=3.7.1",
    "mlx-whisper>=0.4.2",
    "openai>=1.0.0",
    "openai-whisper>=20250625",
    "opencv-python>=4.13.0.92",
    "prompt-toolkit>=3.0.52",
    "psutil>=7.2.2",
    "requests>=2.32.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.7",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "ruff>=0.15.12",
    "scipy>=1.17.1",
    "sounddevice>=0.5.1",
    "openwakeword>=0.6.0",
    "tavily>=1.1.0",
    "tiktoken>=0.12.0",
    "urllib3>=2.7.0",
    "whisper>=1.1.10",
    "wikipedia>=1.4.0",
    "pillow>=11.0.0",
    "yfinance>=1.3.0",
    "textual>=8.2.5",
    "mlx-audio>=0.4.3",
    "webrtcvad>=2.0.10",
    "supervisor>=4.3.0",
    "dateparser>=1.4.1",
    "gliner2>=1.3.2",
    "langchain-openai>=1.0.0",
    "langgraph-store-mongodb>=0.3.0",
    "langmem>=0.0.30",
    "supertonic>=1.3.1",
    "mcp>=1.26.0",
    "deepeval>=2.5.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "langchain>=1.3.14",
    "pytest-json-report>=1.5.0",
]

[project.scripts]
mcp_server = "mcp_server:main"

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "agents", "skills", "utils"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = ["eval: integration eval tests (require live inference + DB)"]
addopts = "--json-report --json-report-file=tests/eval/results/latest.json --json-report-indent=2"

[tool.ruff]
indent-width = 2

[tool.ruff.format]
indent-style = "tab"
