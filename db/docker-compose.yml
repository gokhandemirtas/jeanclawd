version: '3.8'

services:
  mongodb:
    image: mongodb/mongodb-atlas-local:preview
    container_name: langbox-mongodb
    hostname: mongodb
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-langbox}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_atlas_config:/data/configdb
      - mongodb_mongot:/data/mongot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local
  mongodb_atlas_config:
    driver: local
  mongodb_mongot:
    driver: local
