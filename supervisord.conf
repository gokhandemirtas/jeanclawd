[supervisord]
nodaemon = false
logfile = /Users/gokhandemirtas/Projects/pydantic-aida/logs/supervisord.log
pidfile = /Users/gokhandemirtas/Projects/pydantic-aida/logs/supervisord.pid
loglevel = info

[unix_http_server]
file = /Users/gokhandemirtas/Projects/pydantic-aida/logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///Users/gokhandemirtas/Projects/pydantic-aida/logs/supervisor.sock

[program:aida]
command = /Users/gokhandemirtas/Projects/pydantic-aida/.venv/bin/python main.py  --server
directory = /Users/gokhandemirtas/Projects/pydantic-aida
autostart = false
autorestart = true
startretries = 5
startsecs = 3
stdout_logfile = /Users/gokhandemirtas/Projects/pydantic-aida/logs/aida.out.log
stderr_logfile = /Users/gokhandemirtas/Projects/pydantic-aida/logs/aida.err.log
stdout_logfile_maxbytes = 10MB
stderr_logfile_maxbytes = 10MB
stdout_logfile_backups = 3
stderr_logfile_backups = 3
environment = PYTHONUNBUFFERED="1"

